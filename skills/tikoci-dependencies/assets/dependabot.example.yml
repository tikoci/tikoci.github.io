# tikoci starting Dependabot config. Save as .github/dependabot.yml.
# See tikoci-dependencies.
version: 2
updates:
  # Action SHAs, bumped weekly in one grouped PR.
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    # Version updates wait until a release is a week old; security updates do not.
    cooldown:
      default-days: 7
    groups:
      github-actions:
        patterns: ["*"]

  # Packages in package.json and bun.lock. Drop this block for a repo that
  # updates by hand on a stated schedule.
  - package-ecosystem: bun
    directory: /
    schedule:
      interval: weekly
    cooldown:
      default-days: 7
    groups:
      bun:
        patterns: ["*"]
    ignore:
      # Moves with the Bun pin in packageManager (tikoci-toolchain).
      - dependency-name: "@types/bun"
